name: Build & Release BekreVPN.exe

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: pip install pyinstaller customtkinter

      - name: EXE build
        run: pyinstaller --onefile --windowed --name BekreVPN client/vpn_client.py

      - name: SHA256 checksum
        run: certutil -hashfile dist\BekreVPN.exe SHA256 > dist\BekreVPN.exe.sha256

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BekreVPN ${{ github.ref_name }}"
          body: |
            ## BekreVPN ${{ github.ref_name }}

            **Bu EXE tek başına bir VPN hizmetine erişim sağlamaz.** Çalışması için kendi VPN sunucunuza ait WireGuard, OpenVPN ve Stunnel yapılandırmalarını oluşturmanız gerekir. Proje sahibinin canlı sunucu bilgileri ve kullanıcı config'leri bu repoya dahil edilmemiştir.

            ### Gereken harici bağımlılıklar
            - WireGuard (wireguard.com/install)
            - OpenVPN (openvpn.net/community-downloads)
            - Stunnel (stunnel.org/downloads.html)

            ### İndirme
            - **BekreVPN.exe** → Windows istemcisi
            - **BekreVPN.exe.sha256** → Checksum doğrulama

            ### Kullanım
            1. EXE'yi indir
            2. Kendi sunucunuz için oluşturduğunuz configs/ klasörünü (wg0.conf, client.ovpn, stunnel.conf) EXE ile aynı dizine koyun
            3. EXE'yi admin olarak çalıştırın

            > Bu EXE code-signing sertifikasıyla imzalanmamıştır, bu nedenle Windows "tanınmayan yayıncı" uyarısı gösterebilir. İsterseniz kaynak koddan kendiniz build edebilirsiniz: client/build_windows.bat

            ---
            *Not: Bu açıklama otomatik üretilir; önceki release açıklamaları geriye dönük güncellenmez.*
          files: |
            dist/BekreVPN.exe
            dist/BekreVPN.exe.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
